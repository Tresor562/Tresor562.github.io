name: NexControl Vercel device recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nexcontrol-vercel-device-recovery.yml']
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Vercel device login
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest login
