name: Nexus 64 Bootstrap Chunks

on:
  push:
    branches: [nexus-64-mini-games]
    paths:
      - '.nexus64/**'
      - '.github/workflows/nexus-64-bootstrap-chunks.yml'

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand Nexus 64 source payload
        run: |
          if [ ! -f .nexus64/READY ]; then echo 'Chunks incomplete'; exit 0; fi
          cat .nexus64/payload.*.part > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/nexus64.zip
          unzip -o /tmp/nexus64.zip -d .
          rm -rf .nexus64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A nexus-store/mini-games nexus-mini-games-android .github/workflows/nexus-mini-games.yml .nexus64
          git commit -m 'feat: expand 64 Nexus mini-games source [skip ci]'
          git push
