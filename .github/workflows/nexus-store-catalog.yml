name: Nexus Store catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync-nexus-store.mjs'
      - 'nexus-store/catalog.json'
      - '.github/workflows/nexus-store-catalog.yml'

permissions:
  contents: write

concurrency:
  group: nexus-store-catalog
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchroniser le catalogue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXUS_REPOS_TOKEN: ${{ secrets.NEXUS_REPOS_TOKEN }}
        run: node scripts/sync-nexus-store.mjs
      - name: Publier les changements
        run: |
          if git diff --quiet -- nexus-store/catalog.json; then
            echo 'Catalogue déjà à jour.'
            exit 0
          fi
          git config user.name 'nexus-store-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add nexus-store/catalog.json
          git commit -m 'Synchronise automatiquement le catalogue Nexus Store'
          git push
