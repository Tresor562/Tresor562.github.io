name: Deploy portfolio Telegram route

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-portfolio-telegram.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Vercel token
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not configured in this repository."
            exit 2
          fi

      - name: Prepare regression-safe deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _portfolio_deploy/.vercel
          cp telegram-bots.html _portfolio_deploy/telegram-bots.html
          cat > _portfolio_deploy/.vercel/project.json <<'JSON'
          {"orgId":"team_DeK4L6JW10CIXpHARpkMQQr8","projectId":"prj_hHsczqhRduxZElFx1mWyYEJAHeop"}
          JSON
          cat > _portfolio_deploy/vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": null,
            "routes": [
              {"src": "/telegram-bots(?:\\.html)?", "dest": "/telegram-bots.html"},
              {"src": "/(.*)", "dest": "https://tresor-hontonnou-portfolio-6c2v8w2nl-tresorhtn-1071s-projects.vercel.app/$1"}
            ]
          }
          JSON

      - name: Deploy to production
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest deploy _portfolio_deploy --prod --yes --token "$VERCEL_TOKEN"
