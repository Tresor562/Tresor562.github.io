name: Build Nexus Store

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths-ignore:
      - 'nexus-store/apps/*.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore verified Nexus Ban APK
        run: |
          mkdir -p nexus-store/apps
          : > /tmp/Nexus-Ban.apk.b64
          cat nexus-store/apk-source/chunk-00.txt nexus-store/apk-source/chunk-01.txt nexus-store/apk-source/chunk-02.txt nexus-store/apk-source/chunk-03.txt nexus-store/apk-source/chunk-04.txt nexus-store/apk-source/chunk-05.txt nexus-store/apk-source/chunk-06.txt >> /tmp/Nexus-Ban.apk.b64
          cat nexus-store/apk-tail/part-00.txt nexus-store/apk-tail/part-01.txt nexus-store/apk-tail/part-02.txt nexus-store/apk-tail/part-03.txt nexus-store/apk-tail/part-04.txt nexus-store/apk-tail/part-05.txt nexus-store/apk-tail/part-06.txt >> /tmp/Nexus-Ban.apk.b64
          head -c 3000 /dev/zero | tr '\0' 'A' >> /tmp/Nexus-Ban.apk.b64
          cat nexus-store/apk-tail/part-10.txt nexus-store/apk-tail/part-11.txt >> /tmp/Nexus-Ban.apk.b64
          test "$(wc -c < /tmp/Nexus-Ban.apk.b64)" = "53264"
          base64 -d /tmp/Nexus-Ban.apk.b64 > nexus-store/apps/Nexus-Ban.apk
          echo '74d0827cbb26740c6fc06329037a570ae2d9907f982e008476d69e1999e75c35  nexus-store/apps/Nexus-Ban.apk' | sha256sum -c -
          unzip -t nexus-store/apps/Nexus-Ban.apk

      - name: Build Nexus Store Android APK
        run: gradle -p nexus-store-android :app:assembleDebug --no-daemon

      - name: Prepare Nexus Store APK
        run: |
          cp nexus-store-android/app/build/outputs/apk/debug/app-debug.apk nexus-store/apps/Nexus-Store.apk
          unzip -t nexus-store/apps/Nexus-Store.apk

      - name: Upload Nexus Store APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Store-APK
          path: nexus-store/apps/Nexus-Store.apk
          if-no-files-found: error

      - name: Commit public installable APKs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f nexus-store/apps/Nexus-Ban.apk nexus-store/apps/Nexus-Store.apk
          if git diff --cached --quiet; then
            echo 'APKs unchanged'
          else
            git commit -m 'Publish Nexus Store installable APKs [skip ci]'
            git push
          fi
