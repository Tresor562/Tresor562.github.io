name: NexControl secret presence probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nxc-supabase-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase secret presence probe
        run: |
          set -euo pipefail
          curl -fsS https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-secret-presence-probe
