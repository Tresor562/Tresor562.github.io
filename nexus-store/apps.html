<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050912"><title>Apps · Nexus Store</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./premium.css"></head><body><header class="topbar"><a class="brand" href="./"><span class="brand-icon">N</span><span>Nexus Store</span></a><nav class="desktop-nav"><a href="./">Pour vous</a><a href="./games.html">Jeux</a><a class="active" href="./apps.html">Apps</a><a href="./categories.html">Catégories</a><a href="./settings.html">Mises à jour</a></nav><div class="top-actions"><a class="search-action" href="./search.html" aria-label="Rechercher">⌕</a><a class="avatar" href="./account.html" aria-label="Compte Nexus">N</a></div></header><main><section class="page-title"><h1>Apps</h1><p>Toutes les applications Nexus.</p></section><div class="chips"><a class="chip active" href="./apps.html">Tout</a><a class="chip" href="./categories.html">Catégories</a><a class="chip" href="./search.html">Recherche</a></div><section class="app-list" id="appsList"></section></main><nav class="bottom-nav"><a href="./"><span>⌂</span>Accueil</a><a href="./games.html"><span>🎮</span>Jeux</a><a class="active" href="./apps.html"><span>▦</span>Apps</a><a href="./settings.html"><span>♧</span>Mises à jour</a><a href="./library.html"><span>▣</span>Bibliothèque</a></nav><script>const esc=(v='')=>String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const href=a=>`./app.html?id=${encodeURIComponent(a.id)}`;const icon=a=>a.icon?`<img class="app-icon image-icon" src="${esc(a.icon)}" alt="${esc(a.name)}">`:`<div class="app-icon" style="--c1:${a.colors?.[0]||'#253858'};--c2:${a.colors?.[1]||'#5b8cff'}">${esc(a.name.slice(0,2).toUpperCase())}</div>`;const button=a=>a.web?`<a class="pill-action ready" href="${esc(a.web)}">Ouvrir</a>`:a.android?`<a class="pill-action ready" href="${esc(a.android)}">Installer</a>`:`<button class="pill-action" disabled>Bientôt</button>`;Promise.all([fetch('./catalog.json',{cache:'no-store'}).then(r=>r.json()),fetch('./updates.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>({}))]).then(([catalog,updates])=>{const apps=catalog.map(a=>({...a,...(updates[a.id]||{})}));document.getElementById('appsList').innerHTML=apps.map(a=>`<article class="app-row"><a class="app-link" href="${href(a)}">${icon(a)}<div class="app-copy"><h3>${esc(a.name)}</h3><div class="meta">${esc(a.category||'Application')} · ${esc(a.version||'')}</div><p>${esc(a.description||'')}</p></div></a>${button(a)}</article>`).join('')}).catch(()=>{document.getElementById('appsList').innerHTML='<div class="empty-state"><h2>Impossible de charger les apps</h2></div>'});</script></body></html>
