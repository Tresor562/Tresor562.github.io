<!doctype html>\n<!-- NexControl independent web console · Supabase bridge v9 -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#080808">
<title>NexControl</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#080808;color:#f2f0ea;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#080808;z-index:2}
#boot>div{display:grid;gap:12px;text-align:center}
#mark{font-weight:900;letter-spacing:-.05em;font-size:28px}
#status{color:#9a9892;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#080808;z-index:1}
#error{display:none;max-width:min(560px,calc(100vw - 36px));padding:24px;border:1px solid #2a2927;border-radius:20px;background:#111;text-align:left}
#error strong{display:block;font-size:20px;margin-bottom:10px}
#error p{margin:0;color:#aaa;line-height:1.6}
#error button{margin-top:18px;border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div id="boot"><div><div id="mark">NEXCONTROL</div><div id="status">Connexion sécurisée…</div><div id="error"><strong>NexControl indisponible</strong><p id="errorText"></p><button id="retry">Réessayer</button></div></div></div>
<iframe id="app" title="NexControl"></iframe>
<script>
(()=>{
  const GATEWAY='https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nexcontrol-ui';
  const TOKEN_KEY='nxc_web_proxy_session_v1';
  const frame=document.getElementById('app');
  const boot=document.getElementById('boot');
  const status=document.getElementById('status');
  const errorBox=document.getElementById('error');
  const errorText=document.getElementById('errorText');
  let currentRoute='/';
  let loading=false;

  function cleanRoute(raw){
    let v=String(raw||'/');
    if(!v.startsWith('/')||v.startsWith('//'))v='/';
    return v;
  }
  function token(){return sessionStorage.getItem(TOKEN_KEY)||''}
  function setToken(v){if(v)sessionStorage.setItem(TOKEN_KEY,v);else sessionStorage.removeItem(TOKEN_KEY)}
  function gatewayUrl(route){return GATEWAY+'?route='+encodeURIComponent(cleanRoute(route))}
  async function bridge(route,opt={}){
    const headers=new Headers(opt.headers||{});
    const t=token(); if(t)headers.set('x-nxc-session',t);
    const r=await fetch(gatewayUrl(route),{...opt,headers,redirect:'manual',cache:'no-store'});
    const fresh=r.headers.get('x-nxc-session'); if(fresh)setToken(fresh);
    if(r.status===401)setToken('');
    return r;
  }
  function pageUrl(route){
    const u=new URL(location.href);u.searchParams.set('route',cleanRoute(route));u.hash='';return u;
  }
  function showError(message){
    status.textContent='Erreur';
    errorText.textContent=message||'Impossible de charger l’interface.';
    errorBox.style.display='block';boot.style.display='grid';
  }
  function helperScript(route){
    return '<script>(()=>{'+
      'const P=parent.NXCProxy;const CUR='+JSON.stringify(route)+';'+
      'const rawFetch=window.fetch.bind(window);'+
      'function pathOf(raw){try{const u=new URL(raw,location.origin);if(u.origin===location.origin&&u.pathname.startsWith("/api/"))return u.pathname+u.search}catch{}return ""}'+
      'window.fetch=async(input,init={})=>{const raw=typeof input==="string"?input:input&&input.url;const p=pathOf(raw||"");if(!p)return rawFetch(input,init);const r=await P.bridge(p,init);const loc=r.headers.get("x-nxc-location");if(loc)setTimeout(()=>P.navigate(loc),0);return r};'+
      'document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[href]");if(!a)return;const h=a.getAttribute("href")||"";if(h.startsWith("/")&&!h.startsWith("//")){e.preventDefault();P.navigate(h)}},true);'+
      'document.addEventListener("submit",async e=>{const f=e.target;if(!(f instanceof HTMLFormElement))return;const raw=f.getAttribute("action")||CUR;let u;try{u=new URL(raw,location.origin)}catch{return}if(u.origin!==location.origin)return;e.preventDefault();const method=(f.method||"GET").toUpperCase();if(method==="GET"){const p=new URLSearchParams(new FormData(f));P.navigate(u.pathname+(p.toString()?"?"+p:""));return}const fd=new FormData(f);let body,headers={};if((f.enctype||"").toLowerCase().includes("multipart/form-data"))body=fd;else{body=new URLSearchParams(fd);headers["content-type"]="application/x-www-form-urlencoded;charset=UTF-8"};try{const r=await P.bridge(u.pathname+u.search,{method,headers,body});const loc=r.headers.get("x-nxc-location");const fresh=r.headers.get("x-nxc-session");if(u.pathname==="/api/admin/login"&&loc==="/login"&&!fresh){let m=f.querySelector("[data-nxc-error]");if(!m){m=document.createElement("div");m.dataset.nxcError="1";m.style.cssText="margin-top:12px;color:#ffb4b4;font-size:13px";f.appendChild(m)}m.textContent="Mot de passe incorrect.";return}if(loc){P.navigate(loc);return}if(r.ok){P.reload()}else{let msg="HTTP "+r.status;try{const j=await r.clone().json();msg=j.error||j.message||msg}catch{}alert(msg)}}catch(err){alert("NexControl : "+err.message)}},true);'+
      'window.addEventListener("error",()=>{},true);'+
    '})();<\\/script>';
  }
  function injectHelper(html,route){
    const helper=helperScript(route);
    if(/<head\b/i.test(html))return html.replace(/<head([^>]*)>/i,'<head$1>'+helper);
    return helper+html;
  }
  async function load(route,depth=0){
    if(loading&&depth===0)return;
    if(depth===0)loading=true;
    route=cleanRoute(route);
    status.textContent='Chargement…';errorBox.style.display='none';boot.style.display='grid';
    try{
      const r=await bridge(route,{method:'GET',headers:{accept:'text/html,*/*'}});
      const loc=r.headers.get('x-nxc-location');
      if(loc&&depth<6){currentRoute=cleanRoute(loc);return await load(currentRoute,depth+1)}
      if(!r.ok)throw new Error('HTTP '+r.status);
      const body=await r.text();
      if(!/^\s*(<!doctype|<html)/i.test(body))throw new Error('Réponse HTML invalide');
      currentRoute=route;
      frame.srcdoc=injectHelper(body,route);
      frame.onload=()=>{boot.style.display='none'};
      if(frame.contentDocument?.readyState==='complete')boot.style.display='none';
    }catch(err){showError(err&&err.message?err.message:String(err))}
    finally{if(depth===0)loading=false}
  }
  function navigate(route,replace=false){
    route=cleanRoute(route);
    const next=pageUrl(route);
    if(replace)history.replaceState({route},'',next);else history.pushState({route},'',next);
    load(route);
  }
  window.NXCProxy={
    bridge,
    navigate,
    reload:()=>load(currentRoute),
    clearSession:()=>setToken('')
  };
  addEventListener('popstate',()=>load(cleanRoute(new URL(location.href).searchParams.get('route')||'/')));
  document.getElementById('retry').onclick=()=>load(currentRoute);
  const initial=cleanRoute(new URL(location.href).searchParams.get('route')||'/');
  currentRoute=initial;
  if(!new URL(location.href).searchParams.has('route'))history.replaceState({route:initial},'',pageUrl(initial));
  load(initial);
})();
</script>
</body>
</html>
